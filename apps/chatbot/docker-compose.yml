services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kubri_bot_dev
    ports:
      - "54329:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - kubri-bot-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  kubri-bot-pg:
