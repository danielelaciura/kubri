description: Campagna standard — "non ho mai lavorato", "non ho studiato", "non so quale corso" — risposta completa senza valore su domande facoltative (D56)
campaign: campaigns/kubri-standard.json
turns:
  - start: true
    expect: { sent: [system.welcome] }

  - user: "italiano"
    expect: { step: privacy }

  - user: "accetto"
    nlu: { intent: choice, choice: accepted }
    expect: { step: pool_globale }

  - user: "sì"
    nlu: { intent: choice, choice: accepted }
    expect: { step: professionale, question: lavori }

  # The hints tell the LLM to give no value for "none" (lavori and studi are optional).
  # Spec §7.2 point 3: complete → the question moves on, without re-asking it.
  - user: "non ho mai lavorato"
    nlu: { completeness: complete }
    expect:
      question: competenze
      sent: [professionale.competenze]
      effects: []
      profile: { workExperience: null }

  - user: "so pulire e cucinare"
    nlu: { patch: { skillsAndCompetences: [pulizie, cucina] } }
    expect: { question: studi, sent: [professionale.studi] }

  - user: "non ho studiato"
    nlu: { completeness: complete }
    expect:
      step: personale
      question: nome
      sent: [system.progress, personale.title, personale.nome]
      effects: ["EnqueueJob:kubri-webhook:block.completed"]
      profile: { educationAndTraining: null }

  - user: "Ali Hassan, 2/2/2002, vivo a Roma in via Appia 1, niente patente"
    nlu:
      patch:
        firstName: Ali
        lastName: Hassan
        birthday: "2002-02-02"
        address: Via Appia 1
        location: Roma
        drivingLicense: false
    expect: { step: trasversale, question: lingue }

  - user: "arabo, l'italiano poco, l'inglese bene"
    nlu:
      patch: { language: ar, italianLevel: base, additionalLanguages: ["inglese (avanzato)"] }
    expect: { question: lavoro_desiderato, sent: [trasversale.lavoro_desiderato] }

  - user: "addetto alle pulizie"
    nlu: { patch: { jobPreferences.preferredJob: addetto alle pulizie } }
    expect: { question: formazione, sent: [trasversale.formazione] }

  - user: "sì, mi interessa"
    nlu: { patch: { learningPreferences.isInterested: true } }
    expect: { question: quale_corso, sent: [trasversale.quale_corso] }

  # Undecided: the hint asks for no value, and the question is optional — no flag.
  - user: "non so ancora, uno qualsiasi"
    nlu: { completeness: complete }
    expect:
      step: cv
      question: null
      sent: [cv]
      effects: ["EnqueueJob:kubri-webhook:block.completed"]
      profile: { learningPreferences.isInterested: true, learningPreferences.preference: null }
