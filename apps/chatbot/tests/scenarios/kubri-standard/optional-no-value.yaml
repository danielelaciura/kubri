description: Campagna standard — "non ho studiato" / "non ho mai lavorato" su domande facoltative, risposta completa senza valore
campaign: campaigns/kubri-standard.json
turns:
  - start: true
    expect: { sent: [system.welcome] }

  - user: "italiano"
    expect: { step: privacy }

  - user: "accetto"
    nlu: { intent: choice, choice: accepted }
    expect: { step: pool_globale }

  - user: "sì"
    nlu: { intent: choice, choice: accepted }
    expect: { question: nome }

  - user: "Ali Hassan, 2/2/2002, Egitto, vivo a Roma, via Appia 1, ali@example.com"
    nlu:
      patch:
        firstName: Ali
        lastName: Hassan
        birthday: "2002-02-02"
        country: EG
        location: Roma
        address: Via Appia 1
        email: ali@example.com
    expect: { step: lingue, question: lingua_madre }

  - user: "arabo, l'italiano poco, l'inglese bene"
    nlu:
      patch: { language: ar, italianLevel: base, additionalLanguages: ["inglese (avanzato)"] }
    expect: { step: mobilita, question: permesso }

  - user: "ho il permesso, niente patente, a piedi"
    nlu: { patch: { workingPermit: true, drivingLicense: false, transport: a piedi } }
    expect:
      {
        step: esperienze,
        question: studi,
        sent: [system.progress, esperienze.title, esperienze.studi],
      }

  # The hints tell the LLM to give no value for "none" (studi and lavori are optional).
  # Spec §7.2 point 3: complete → the question moves on, without re-asking it.
  - user: "non ho studiato"
    nlu: { completeness: complete }
    expect:
      question: lavori
      sent: [esperienze.lavori]
      effects: []
      profile: { educationAndTraining: null }

  - user: "non ho mai lavorato"
    nlu: { completeness: complete }
    expect:
      question: competenze
      sent: [esperienze.competenze]
      effects: []
      profile: { workExperience: null }
