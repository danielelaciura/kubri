description: Campagna standard — risposte parziali, incerte e assenti, conferma di un valore incerto, campi non risolti
campaign: campaigns/kubri-standard.json
turns:
  - start: true
    expect: { sent: [system.welcome] }

  - user: "italiano"
    expect: { step: privacy }

  - user: "accetto"
    nlu: { intent: choice, choice: accepted }
    expect: { step: pool_globale }

  - user: "no"
    nlu: { intent: choice, choice: declined }
    expect: { step: professionale, question: lavori }

  # Partial list answer: the value is saved, then a targeted follow-up on what is missing.
  - user: "ho fatto il cameriere in Marocco"
    nlu:
      patch: { workExperience: ["Marocco: Cameriere"] }
      completeness: partial
      missing: "per quanto tempo e in che anni"
    expect:
      question: lavori
      sent: [professionale.lavori]
      effects: ["ApplyPatch:extraction:workExperience"]

  # D51: the value saved by the partial answer is not an answer to this turn by itself.
  - user: "uhm"
    nlu: { intent: unclear }
    expect: { question: lavori, sent: [professionale.lavori], effects: [] }

  - user: "dal 2015 al 2018, all'Hotel Atlas di Marrakech"
    nlu:
      patch: { workExperience: ["2015 - 2018 Hotel Atlas, Marrakech (Marocco): Cameriere"] }
      completeness: complete
    expect:
      question: competenze
      sent: [professionale.competenze]
      effects: ["ApplyPatch:extraction:workExperience"]
      profile: { workExperience: ["2015 - 2018 Hotel Atlas, Marrakech (Marocco): Cameriere"] }

  # An optional question never answered: two rephrasings, then a silent skip (no flag).
  - user: "eh?"
    nlu: { intent: unclear }
    expect: { question: competenze, sent: [professionale.competenze], effects: [] }

  - user: "mah"
    nlu: { intent: unclear }
    expect: { question: competenze, sent: [professionale.competenze], effects: [] }

  - user: "uhm"
    nlu: { intent: unclear }
    expect:
      question: studi
      sent: [professionale.studi]
      effects: []
      profile: { skillsAndCompetences: null }

  # A refusal skips an optional question at once (D43).
  - user: "sulle scuole preferisco non rispondere"
    nlu: { intent: refusal }
    expect:
      step: personale
      question: nome
      sent: [system.progress, personale.title, personale.nome]
      effects: ["EnqueueJob:kubri-webhook:block.completed"]

  # Name and surname without the birth date: the answer is complete, nascita is asked next.
  - user: "Mario Rossi"
    nlu: { patch: { firstName: Mario, lastName: Rossi } }
    expect:
      question: nascita
      sent: [personale.nascita]
      effects: ["ApplyPatch:extraction:firstName,lastName"]

  # Only the year: no value can be saved, the bot asks for what is missing.
  - user: "nel 1990"
    nlu: { completeness: partial, missing: "giorno e mese di nascita" }
    expect: { question: nascita, sent: [personale.nascita], effects: [] }

  - user: "il 12 marzo 1990"
    nlu: { patch: { birthday: "1990-03-12" }, completeness: complete }
    expect:
      question: indirizzo
      sent: [personale.indirizzo]
      effects: ["ApplyPatch:extraction:birthday"]

  # Help: the extracted data is dropped (D52), no clarification is used up.
  - user: "cosa devo scrivere? abito in via Roma 10"
    nlu: { intent: help, patch: { address: Via Roma 10 } }
    expect:
      question: indirizzo
      sent: [system.help, personale.indirizzo]
      effects: []
      profile: { address: null }

  # A value below the threshold asks for a confirmation instead of being saved.
  - user: "via Roma 10 credo, o forse 12"
    nlu:
      patch:
        - { field: address, value: Via Roma 10, confidence: 0.5 }
      completeness: complete
    expect:
      { question: indirizzo, sent: [system.confirm_value], effects: [], profile: { address: null } }

  # D53: the deterministic "sì" wins over an LLM reading of "no".
  - user: "sì"
    nlu: { intent: choice, choice: "no" }
    expect:
      question: comune
      sent: [personale.comune]
      effects: ["ApplyPatch:extraction:address", "EnqueueJob:geocoding"]
      profile: { address: Via Roma 10 }

  # A required question never answered: two rephrasings, then unresolved + flag.
  - user: "dipende"
    nlu: { intent: answer }
    expect: { question: comune, sent: [personale.comune], effects: [] }

  - user: "boh"
    nlu: { intent: unclear }
    expect: { question: comune, sent: [personale.comune], effects: [] }

  - user: "non saprei"
    nlu: { intent: unclear }
    expect:
      question: patente
      sent: [personale.patente]
      effects:
        - "MarkFieldUnresolved:location"
        - "FlagSession:unresolved_field:location"
      profile: { location: null }

  - user: "no"
    nlu: { patch: { drivingLicense: false } }
    expect:
      step: trasversale
      question: lingue
      sent: [system.progress, trasversale.title, trasversale.lingue]
      effects:
        - "ApplyPatch:extraction:drivingLicense"
        - "EnqueueJob:kubri-webhook:block.completed"

  - user: "arabo, l'italiano abbastanza, nient'altro"
    nlu: { patch: { language: ar, italianLevel: intermedio }, completeness: complete }
    expect:
      question: lavoro_desiderato
      effects: ["ApplyPatch:extraction:language,italianLevel"]
      profile: { language: ar, italianLevel: intermedio, additionalLanguages: null }
